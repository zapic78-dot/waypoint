<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayppoint Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --positive: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --black: #111827;
    --grey-1: #f9fafb;
    --grey-2: #e5e7eb;
    --grey-4: #9ca3af;
    --grey-6: #4b5563;
    --white: #ffffff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--black);
    background: var(--grey-1);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* LOGIN SCREEN */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
    padding: 20px;
  }
  .login-card {
    background: var(--white);
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 28px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.5px;
  }
  .login-subtitle {
    text-align: center;
    color: var(--grey-6);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .login-form { display: flex; flex-direction: column; gap: 14px; }
  .login-form label { font-size: 13px; color: var(--grey-6); font-weight: 500; }
  .login-form input {
    padding: 12px 14px;
    border: 1px solid var(--grey-2);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    width: 100%;
  }
  .login-form input:focus { border-color: var(--primary); }
  .login-btn {
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  .login-btn:hover { background: var(--primary-dark); }
  .login-btn:disabled { background: var(--grey-2); cursor: not-allowed; }
  .login-error {
    background: #fee2e2;
    color: #991b1b;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .login-error.show { display: block; }

  /* DASHBOARD */
  .dashboard { display: none; min-height: 100vh; }
  .dashboard.active { display: block; }
  .top-bar {
    background: var(--white);
    border-bottom: 1px solid var(--grey-2);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .top-bar-logo {
    font-size: 20px;
    font-weight: 800;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .top-bar-logo .dot {
    width: 10px;
    height: 10px;
    background: #06b6d4;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(6,182,212,0.15);
  }
  .top-bar-right { display: flex; align-items: center; gap: 14px; }
  .user-badge {
    font-size: 13px;
    color: var(--grey-6);
  }
  .user-badge strong { color: var(--black); }
  .logout-btn {
    background: transparent;
    border: 1px solid var(--grey-2);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .page-subtitle {
    color: var(--grey-6);
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* STATS */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--grey-2);
    border-radius: 12px;
    padding: 18px;
  }
  .stat-card .stat-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--grey-6);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .stat-card .stat-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--black);
  }
  .stat-card.pending .stat-value { color: var(--warning); }
  .stat-card.confirmed .stat-value { color: var(--primary); }
  .stat-card.completed .stat-value { color: var(--positive); }
  .stat-card.revenue .stat-value { color: var(--positive); }

  /* FILTERS */
  .filter-bar {
    background: var(--white);
    border: 1px solid var(--grey-2);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--grey-2);
    background: var(--white);
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--primary); }
  .filter-btn.active {
    background: var(--primary);
    color: var(--white);
    border-color: var(--primary);
  }
  .refresh-btn {
    margin-left: auto;
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .refresh-btn:hover { background: var(--primary-dark); }

  /* BOOKINGS TABLE */
  .bookings-table-wrap {
    background: var(--white);
    border: 1px solid var(--grey-2);
    border-radius: 12px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead {
    background: var(--grey-1);
  }
  th {
    text-align: left;
    padding: 12px 14px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--grey-6);
    font-weight: 600;
    border-bottom: 1px solid var(--grey-2);
  }
  td {
    padding: 14px;
    font-size: 14px;
    border-bottom: 1px solid var(--grey-2);
    vertical-align: top;
  }
  tbody tr:hover { background: var(--grey-1); }
  tbody tr:last-child td { border-bottom: none; }

  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .status-pending { background: #fef3c7; color: #92400e; }
  .status-confirmed { background: #dbeafe; color: #1e40af; }
  .status-completed { background: #d1fae5; color: #065f46; }
  .status-cancelled { background: #fee2e2; color: #991b1b; }

  .row-customer { font-weight: 600; }
  .row-meta { font-size: 12px; color: var(--grey-6); margin-top: 2px; }
  .row-route { font-size: 13px; }
  .row-route .arrow { color: var(--grey-4); margin: 0 4px; }

  .action-btn {
    padding: 5px 10px;
    border: 1px solid var(--grey-2);
    background: var(--white);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-right: 4px;
    transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--primary); background: var(--grey-1); }
  .action-btn.primary { background: var(--primary); color: var(--white); border-color: var(--primary); }
  .action-btn.primary:hover { background: var(--primary-dark); }
  .action-btn.danger { color: var(--danger); border-color: #fecaca; }
  .action-btn.danger:hover { background: #fee2e2; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--grey-6);
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--grey-6);
  }

  /* DETAIL MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--white);
    border-radius: 16px;
    max-width: 600px;
    width: 100%;
    overflow: hidden;
    margin-top: 40px;
  }
  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--grey-2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close {
    background: transparent;
    border: none;
    font-size: 26px;
    cursor: pointer;
    color: var(--grey-6);
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }
  .modal-close:hover { background: var(--grey-1); }
  .modal-body { padding: 20px; }
  .detail-row {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--grey-1);
    font-size: 14px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label {
    color: var(--grey-6);
    font-weight: 500;
  }
  .detail-value { color: var(--black); }
  .modal-actions {
    padding: 16px 20px;
    border-top: 1px solid var(--grey-2);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--grey-1);
  }

  @media (max-width: 800px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .container { padding: 14px; }
    th, td { padding: 10px 8px; font-size: 13px; }
    .row-meta { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🔒 Wayppoint Admin</div>
    <div class="login-subtitle">Sign in to manage bookings</div>
    <div class="login-error" id="loginError"></div>
    <form class="login-form" id="loginForm" onsubmit="event.preventDefault(); doLogin();">
      <div>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
    </form>
    <p style="text-align:center;font-size:12px;color:var(--grey-4);margin-top:20px;">
      Authorized personnel only.
    </p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div class="top-bar-logo">
      <span class="dot"></span>
      Wayppoint Admin
    </div>
    <div class="top-bar-right">
      <div class="user-badge">Signed in as <strong id="userEmail">—</strong> <span id="userRoleBadge"></span></div>
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <h1 class="page-title">Bookings</h1>
    <p class="page-subtitle">All ride requests from your customers, sorted by newest first.</p>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card pending">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="statPending">—</div>
      </div>
      <div class="stat-card confirmed">
        <div class="stat-label">Confirmed</div>
        <div class="stat-value" id="statConfirmed">—</div>
      </div>
      <div class="stat-card completed">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="statCompleted">—</div>
      </div>
      <div class="stat-card revenue">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value" id="statRevenue">—</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">Pending</button>
      <button class="filter-btn" data-filter="confirmed" onclick="setFilter('confirmed')">Confirmed</button>
      <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">Completed</button>
      <button class="filter-btn" data-filter="cancelled" onclick="setFilter('cancelled')">Cancelled</button>
      <button class="refresh-btn" onclick="loadBookings()">🔄 Refresh</button>
    </div>

    <!-- Table -->
    <div class="bookings-table-wrap">
      <div id="bookingsContent">
        <div class="loading">Loading bookings...</div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" onclick="if(event.target===this) closeDetail()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Booking details</div>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-actions" id="detailActions"></div>
  </div>
</div>

<script>
  // ============ SUPABASE CONFIG ============
  const SUPABASE_URL = 'https://vodiyakxjekusndirtwm.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable__zcqj4jF2PYdg3GQy3OntQ_wIUojHtF';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentRole = null;
  let allBookings = [];
  let currentFilter = 'all';

  // ============ AUTH ============
  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    errorEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = error.message || 'Login failed. Check your email and password.';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    await afterLogin(data.user);
  }

  async function afterLogin(user) {
    // Fetch role from profiles
    const { data: profile, error: profErr } = await sb
      .from('profiles')
      .select('role, full_name')
      .eq('id', user.id)
      .single();

    if (profErr || !profile) {
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = 'No profile found for your account. Contact the administrator.';
      errorEl.classList.add('show');
      await sb.auth.signOut();
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').textContent = 'Sign in';
      return;
    }

    if (profile.role !== 'admin' && profile.role !== 'staff') {
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = 'Your account does not have access to the admin panel.';
      errorEl.classList.add('show');
      await sb.auth.signOut();
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').textContent = 'Sign in';
      return;
    }

    currentUser = user;
    currentRole = profile.role;

    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('userRoleBadge').textContent =
      profile.role === 'admin' ? '· 👑 Admin' : '· 👤 Staff';

    loadBookings();
  }

  async function doLogout() {
    await sb.auth.signOut();
    location.reload();
  }

  // ============ LOAD BOOKINGS ============
  async function loadBookings() {
    const content = document.getElementById('bookingsContent');
    content.innerHTML = '<div class="loading">Loading bookings...</div>';

    const { data, error } = await sb
      .from('bookings')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      content.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><div>Error loading bookings: ${error.message}</div></div>`;
      return;
    }

    allBookings = data || [];
    updateStats();
    renderBookings();
  }

  function updateStats() {
    const pending = allBookings.filter(b => b.status === 'pending').length;
    const confirmed = allBookings.filter(b => b.status === 'confirmed').length;
    const completed = allBookings.filter(b => b.status === 'completed').length;
    const revenue = allBookings
      .filter(b => b.status === 'completed')
      .reduce((sum, b) => sum + (Number(b.price_usd) || 0), 0);

    document.getElementById('statPending').textContent = pending;
    document.getElementById('statConfirmed').textContent = confirmed;
    document.getElementById('statCompleted').textContent = completed;
    document.getElementById('statRevenue').textContent = '$' + revenue.toFixed(0);
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === f);
    });
    renderBookings();
  }

  function renderBookings() {
    const content = document.getElementById('bookingsContent');
    const filtered = currentFilter === 'all'
      ? allBookings
      : allBookings.filter(b => b.status === currentFilter);

    if (filtered.length === 0) {
      content.innerHTML = `<div class="empty-state"><div class="emoji">📭</div><div>No ${currentFilter === 'all' ? '' : currentFilter} bookings yet.</div></div>`;
      return;
    }

    let html = `
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Route</th>
            <th>When</th>
            <th>Vehicle</th>
            <th>Price</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
    `;

    filtered.forEach(b => {
      const created = new Date(b.created_at).toLocaleString();
      const pickup = b.pickup_datetime ? new Date(b.pickup_datetime).toLocaleString() : '—';
      html += `
        <tr>
          <td>
            <div class="row-customer">${escapeHtml(b.passenger_name)}</div>
            <div class="row-meta">${escapeHtml(b.passenger_email)}<br>${escapeHtml(b.passenger_phone)}</div>
          </td>
          <td>
            <div class="row-route">
              <strong>${escapeHtml(b.pickup_address)}</strong>
              <span class="arrow">→</span>
              ${escapeHtml(b.dropoff_address || '—')}
            </div>
            <div class="row-meta">${b.distance_miles ? b.distance_miles + ' mi' : ''} ${b.duration_minutes ? '· ~' + b.duration_minutes + ' min' : ''}</div>
          </td>
          <td>${pickup}<div class="row-meta">Booked: ${created}</div></td>
          <td>${escapeHtml(b.vehicle_type)}<div class="row-meta">${b.trip_type}</div></td>
          <td><strong>$${b.price_usd}</strong></td>
          <td><span class="status-badge status-${b.status}">${b.status}</span></td>
          <td><button class="action-btn primary" onclick="openDetail('${b.id}')">View</button></td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    content.innerHTML = html;
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  // ============ DETAIL MODAL ============
  function openDetail(id) {
    const b = allBookings.find(x => x.id === id);
    if (!b) return;

    const body = document.getElementById('detailBody');
    body.innerHTML = `
      <div class="detail-row"><div class="detail-label">Customer</div><div class="detail-value">${escapeHtml(b.passenger_name)}</div></div>
      <div class="detail-row"><div class="detail-label">Email</div><div class="detail-value"><a href="mailto:${escapeHtml(b.passenger_email)}" style="color:var(--primary);">${escapeHtml(b.passenger_email)}</a></div></div>
      <div class="detail-row"><div class="detail-label">Phone</div><div class="detail-value"><a href="tel:${escapeHtml(b.passenger_phone)}" style="color:var(--primary);">${escapeHtml(b.passenger_phone)}</a></div></div>
      <div class="detail-row"><div class="detail-label">Trip type</div><div class="detail-value">${escapeHtml(b.trip_type)}</div></div>
      <div class="detail-row"><div class="detail-label">From</div><div class="detail-value">${escapeHtml(b.pickup_address)}</div></div>
      <div class="detail-row"><div class="detail-label">To</div><div class="detail-value">${escapeHtml(b.dropoff_address || '—')}</div></div>
      <div class="detail-row"><div class="detail-label">When</div><div class="detail-value">${b.pickup_datetime ? new Date(b.pickup_datetime).toLocaleString() : '—'}</div></div>
      <div class="detail-row"><div class="detail-label">Vehicle</div><div class="detail-value">${escapeHtml(b.vehicle_type)}</div></div>
      <div class="detail-row"><div class="detail-label">Distance</div><div class="detail-value">${b.distance_miles || '—'} mi · ~${b.duration_minutes || '—'} min</div></div>
      <div class="detail-row"><div class="detail-label">Passengers</div><div class="detail-value">${b.adults || 0} adults, ${b.children || 0} children, ${b.luggage || 0} luggage</div></div>
      <div class="detail-row"><div class="detail-label">Extras</div><div class="detail-value">${escapeHtml(b.extras || '—')}</div></div>
      <div class="detail-row"><div class="detail-label">Comment</div><div class="detail-value">${escapeHtml(b.comment || '—')}</div></div>
      <div class="detail-row"><div class="detail-label">Promo code</div><div class="detail-value">${escapeHtml(b.promo_code || '—')}</div></div>
      <div class="detail-row"><div class="detail-label">Price</div><div class="detail-value"><strong style="font-size:18px;color:var(--positive);">$${b.price_usd}</strong></div></div>
      <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value"><span class="status-badge status-${b.status}">${b.status}</span></div></div>
      <div class="detail-row"><div class="detail-label">Booked at</div><div class="detail-value">${new Date(b.created_at).toLocaleString()}</div></div>
    `;

    const actions = document.getElementById('detailActions');
    const buttons = [];
    if (b.status !== 'confirmed' && b.status !== 'completed' && b.status !== 'cancelled') {
      buttons.push(`<button class="action-btn primary" onclick="updateStatus('${b.id}', 'confirmed')">✓ Confirm</button>`);
    }
    if (b.status === 'confirmed') {
      buttons.push(`<button class="action-btn primary" onclick="updateStatus('${b.id}', 'completed')">✓ Mark completed</button>`);
    }
    if (b.status !== 'cancelled' && b.status !== 'completed') {
      buttons.push(`<button class="action-btn danger" onclick="updateStatus('${b.id}', 'cancelled')">✕ Cancel</button>`);
    }
    if (b.status === 'cancelled' || b.status === 'completed') {
      buttons.push(`<button class="action-btn" onclick="updateStatus('${b.id}', 'pending')">↶ Reopen</button>`);
    }
    buttons.push(`<button class="action-btn" onclick="closeDetail()">Close</button>`);
    actions.innerHTML = buttons.join('');

    document.getElementById('detailModal').classList.add('active');
  }

  function closeDetail() {
    document.getElementById('detailModal').classList.remove('active');
  }

  async function updateStatus(id, newStatus) {
    const { error } = await sb
      .from('bookings')
      .update({ status: newStatus })
      .eq('id', id);

    if (error) {
      alert('Failed to update: ' + error.message);
      return;
    }

    closeDetail();
    await loadBookings();
  }

  // ============ STARTUP: check existing session ============
  (async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user) {
      await afterLogin(session.user);
    }
  })();
</script>

</body>
</html>
